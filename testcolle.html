<style>
    * {
        box-sizing: border-box;
    }

html, body {
  margin: 0;
}

main {
  height: 100vh;
  overflow-y: hidden;
  scroll-snap-type: y mandatory; /* le truc magique */
  scroll-behavior: smooth;       /* scroll fluide (optionnel) */
}

section {
  height: 100vh;                /* chaque section = une page entière */
  scroll-snap-align: start;     /* elle se colle au haut de la page */
}

</style>

<main>
  <section style="background: red;">Section 1</section>
  <section style="background: blue;">Section 2</section>
  <section style="background: green;">Section 3</section>
  <section style="background: purple;">Section 4</section>
</main>
