<section class="soundtrack-section">
    <div class="sts-info">
        <iframe id="st-iframe" src="" title="Rick Astley - Never Gonna Give You Up" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>

        <div class="contents">
            <h3><span id="st-title">TITRE</span> - <span id="st-singer">Artiste</span></h3>
            <p><span id="st-film-title">Titre du film</span> - <span id="st-film-director">Réalisateur</span> (<span
                    id="st-film-date">Date de sortie</span>)</p>
            <em>vendu à environ <span id="st-sold">nombre de ventes</span> millions d'exemplaires.</em>
            <hr>
            <p id="st-description">description du film</p>
            <div class="boutons">
                <a href="" id="music-link" target="_blank" title="Écouter sur spotify (Nouvel onglet)"><img
                        src="images/logo-spotify-blanc.png" alt=""><span class="sr-only">lien spotify</span></a>
                <a href="" id="film-link" title="En savoir plus sur le film - Allociné (Nouvel onglet)"
                    target="_blank"><img src="images/lien-externe (1).png" alt="">Voir le film</a>

            </div>
        </div>
    </div>
    <div class="sts-list">
        <h2>On les connaît par coeur</h2>
        <p>Découvrez le top 10 des bandes originales de films les plus vendues de l'histoire.</p>
        <ol>
            <!-- Filled by JS -->
        </ol>

    </div>
</section>

<style>
    .sr-only {
        border: 0 !important;
        clip: rect(1px, 1px, 1px, 1px) !important;
        -webkit-clip-path: inset(50%) !important;
        clip-path: inset(50%) !important;
        height: 1px !important;
        overflow: hidden !important;
        padding: 0 !important;
        position: absolute !important;
        width: 1px !important;
        white-space: nowrap !important;
    }

    * {
        /* border: gray dotted 1px; */
        padding: 0;
        margin: 0;
    }

    body {
        margin: 0;
        display: flex;
        align-items: center;
        background-color: #640C19;
        color: white;
        font-family: sans-serif;
        max-width: 1200px;
        margin: auto;
    }

    h2, h3 {
        text-transform: uppercase;
    }

    h2 {
        color: #F6D758;
    }

    p {
        max-width: 600px;
    }

    iframe {
        border-radius: 20px;
        box-shadow: 0 0 20px #000000b0;
        width: 30vw;
        aspect-ratio: 16/9;
    }

    hr {
        width: 50px;
        border: solid 1px #ffffff;
        border-radius: 50px;
        margin: 10px 15px;
    }

    .soundtrack-section {
        display: flex;
        align-items: center;
        gap: 80px;
        width: 100%;
        height: 100vh;
    }

    .soundtrack-section>div {
        width: 100%;
        display: flex;
        flex-direction: column;
    }

    .sts-info {
        transition: opacity 0.3s ease;
        gap: 30px;
    }

    .sts-info .contents {
        display: flex;
        flex-direction: column;
        padding: 0 20px;
        gap: 5px;
    }

    .sts-list {
        gap: 20px;
        max-height: 70vh;
    }

    .sts-list ol {
        list-style-type: none;
        display: flex;
        padding: 0;
        padding-left: 10px;
        flex-direction: column;
        margin-top: 15px;
        gap: 5px;
        overflow-y: auto;
    }

    .sts-list li {
        padding: 10px;
        border-radius: 5px;
        border: transparent solid 2px;
        background-color: rgba(0, 0, 0, 0.4);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s ease;
    }

    .sts-list li:hover:not(.active) {
        background-color: rgba(0, 0, 0, 0.6);
        border-color: black;
        transform: translateX(-10px);
    }

    .sts-list li p {
        margin: 0;
    }

    .sts-list .active {
        border-color: #F6D758;
        background-color: #231C0C;
        box-shadow: 0 0 10px #f6d6581e;
        transform: translateX(-10px);
    }

    .st-range {
        width: 25px;
        aspect-ratio: 1/1;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: black;
        color: #F6D758;
        font-weight: 500;
        border-radius: 50%;
    }

    .boutons {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 10px;
    }

    #film-link {
        border: solid 2px white;
        color: white;
        padding: 8px 15px;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 5px;
        width: fit-content;
        transition: all 0.3s ease;
    }

    #film-link img {
        width: 12px;
    }

    #film-link:hover {
        border-color: #F6D758;
        box-shadow: 0 0 10px #f6d6581e;
        transform: scale(1.02);
    }

    #music-link img {
        width: 40px;
        padding: 5px;
        opacity: 0.7;
        transition: all 0.3s ease;
    }

    #music-link:hover img {
        opacity: 1;
        transform: scale(1.05);
    }

    .sts-list ol::-webkit-scrollbar {
        width: 5px;
    }

    em {
        color: #F6D758;
    }

    .sts-list ol::-webkit-scrollbar-track {
  background: transparent;
  margin: 14px; /* espace en haut et bas => raccourcit la barre */
  border-radius: 10px;
}
    .sts-list ol::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.4);
        border-radius: 10px;
        padding: 10px;
    }
</style>

<script>
    fetch('data/music_film.json').then(response => response.json()).then(allsts => {
        console.log(allsts);

        const sts_listdiv = document.querySelector('.sts-list ol');
        const sts_infodiv = document.querySelector('.sts-info');

        sts_listdiv.innerHTML = ''

        allsts.forEach((st) => {
            let element_list = '<li id="st' + st.range + '"><p class = "st-range">' + st.range + '</p><p>' + st.music_title + ' - ' + st.film_title + '</p></li>';
            sts_listdiv.innerHTML += element_list;
        })


        function setActiveClass(id) {
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.sts-list li').forEach((div) => {
                if (div.id !== id) {
                    div.classList.remove('active');
                }
            });
        }

        function transitionInfo(value) {
            sts_infodiv.style.opacity = value;
        }

        function displaystInfo(id) {
            let index = id.replace('st', '') - 1;
            console.log(index)
            document.getElementById('st-iframe').src = allsts[index].yt_link;
            document.getElementById('st-title').innerText = allsts[index].music_title;
            document.getElementById('st-singer').innerText = allsts[index].music_singer;
            document.getElementById('st-film-title').innerText = allsts[index].film_title;
            document.getElementById('st-film-director').innerText = allsts[index].film_director;
            document.getElementById('st-film-date').innerText = allsts[index].film_date;
            document.getElementById('st-sold').innerText = allsts[index].sold;
            document.getElementById('st-description').innerText = allsts[index].music_description[0].fr;
            document.getElementById('film-link').href = allsts[index].film_link;
            document.getElementById('music-link').href = allsts[index].music_link;
        }

        function displayST(stId) {
            setActiveClass(stId);
            transitionInfo(0);
            setTimeout(() => displaystInfo(stId), 300);
            setTimeout(() => transitionInfo(1), 300);
        }

        sts_listdiv.querySelectorAll('li').forEach((li) => {
            li.addEventListener('click', () => {
                const stId = li.id;
                displayST(stId);
            });
        });

        // Display the first soundtrack info at load
        displayST('st1');
    });



</script>
