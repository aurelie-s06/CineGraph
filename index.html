<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link href="https://cdn.tailwindcss.com" rel="stylesheet" />
    <title>CineGraph</title>
  </head>
  <body>
    <div class="lang-select" id="langSelect">
      <button class="lang-btn" id="langBtn">EN <span>▾</span></button>
      <div class="lang-menu" id="traduire">
        <button data-lang="en" value="en">EN</button>
        <button data-lang="fr" value="fr">FR</button>
      </div>
    </div>
    <div class="main">
      <img src="images/accent.png" alt="" class="clap" />
      <h1 class="titre">CineGraph</h1>

      <div class="scroll-down" aria-label="Découvrir la suite">
        <span class="arrow" aria-hidden="true"></span>
      </div>
    </div>

    <!-- Podium -->
    <iframe
      src="section2.html"
      style="width: 100%; height: 100vh; border: none"
      id="section2-iframe"
    ></iframe>

    <!-- Genres musiques -->
    <iframe
      src="musiques-films.html"
      style="width: 100%; height: 100vh; border: none"
      id="musiques-films-iframe"
    ></iframe>

    <footer>
      <a href="mentionslegales.html" id="mentionslegales">Legal Notices</a>
      <br>
      <br>
      <a href="credits.html" id="credits">Credits</a>
      <p class="piedpage" id="piedpage">2025 - CINEGRAPH All rights reserved</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="javascript.js"></script>
    <script>
      /* Fleche */
      const scrollBtn = document.querySelector(".scroll-down");
      scrollBtn.addEventListener("click", () => {
        const section2 = document.getElementById("section2-iframe");
        if (section2) {
          section2.scrollIntoView({ behavior: "smooth" });
        }
      });

      // --- Sélecteur de langue ---
      const langSelect = document.getElementById("langSelect");
      const langBtn = document.getElementById("langBtn");

      langBtn.addEventListener("click", () => {
        langSelect.classList.toggle("open");
      });

      document.querySelectorAll(".lang-menu button").forEach((btn) => {
        btn.addEventListener("click", () => {
          const lang = btn.dataset.lang.toUpperCase();
          langBtn.innerHTML = `${lang} <span>▾</span>`;
          langSelect.classList.remove("open");

          const section2Iframe = document.getElementById("section2-iframe");
          section2Iframe.contentWindow.postMessage({ lang }, "*");

          if (lang === "EN" || lang === "FR") {
          updateLanguage(lang.toLowerCase());
          };
        });
      });

      function updateLanguage(lang) {
        fetch("data/contenuLangue.json")
          .then((res) => res.json())
          .then((data) => {
            const t = data[lang][0];
            document.getElementById("mentionslegales").textContent =
              t["mentionslegales"];
            document.getElementById("credits").textContent = t["credits"];
            document.getElementById("piedpage").textContent = t["piedpage"];
          });
      }
    </script>
  </body>
</html>
